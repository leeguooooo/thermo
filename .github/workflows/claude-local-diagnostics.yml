name: Native modules and CLI
on:
  pull_request:
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.*'
      - 'scripts/verify-native-boundaries.py'
      - 'scripts/verify-performance-boundaries.py'
      - 'scripts/verify-host-boundaries.py'
      - 'scripts/verify-performance-ui.py'
      - 'scripts/verify-performance-ui.swift'
      - 'scripts/bench-pulse*'
      - 'scripts/tests/test_native_boundaries.py'
      - '.github/workflows/claude-local-diagnostics.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: claude-local-${{ github.ref }}
  cancel-in-progress: true
jobs:
  diagnostics:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Record toolchain and SDK
        run: |
          xcrun swift --version
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
      - name: Verify native target and import boundaries
        run: |
          swift package dump-package | python3 scripts/verify-native-boundaries.py --complete --source-root .
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p 'test_native_boundaries.py'
      - name: Test native modules, diagnostics and CLI contracts
        run: swift test --jobs 3 --filter 'ThermoCompositionTests|ClaudeLocalDiagnosticsTests|ClaudeLocalCommandTests|CLICompletenessTests|PrivacyToolsTests|FeatureTests|CaptureScriptLifetimeTests|CaptureCLIHostTests|CaptureScriptActionTests|CaptureScriptRunnerTests|ScrollCaptureLifecycleTests|CaptureLifecycleTests|CaptureModuleTests|DocumentPreviewHostTests|SearchHostIntegrationTests|NativeFeatureAPITests|FeatureLaunch.*Tests|FirstRunPrewarmTests|FeatureTasksTests|ThermoKernelTests|PulseSamplingLifetimeTests|PulseRecorderLifetimeTests|HelperMaintenanceTests|VerificationHelperIsolationTests|AppControlHostTests|MenuLiveSamplerTests|SamplingPlanTests|SettingsValidationTests|MemorySamplingCancellationTests|PerformanceModuleTests|VisibleSamplingTests|SpaceSkippedRemovalTests|SpaceLensModelTests|MainOnlyExitTests|NativeFeatureStopMessageTests|[A-Za-z]+HostRoutingTests|[A-Za-z]+ExitGuardIntegrationTests|SpaceRemovalProtectionIntegrationTests|HistoryHostServicesTests'
      - name: Build App
        run: swift build --jobs 3 --product ThermoApp
      - name: Build isolated performance UI fixture and verify source restoration
        run: |
          python3 scripts/verify-performance-ui.py --jobs 3 --output-dir "$RUNNER_TEMP/thermo-performance-review-ci.noindex"
          test -z "$(git status --porcelain)"
      - name: Compile private performance API boundaries
        run: |
          python3 scripts/verify-performance-boundaries.py --jobs 3 --output-dir "$RUNNER_TEMP/thermo-performance-boundaries-ci.noindex"
          test -z "$(git status --porcelain)"
      - name: Compile private pulse benchmark fixtures without measuring the runner
        run: |
          python3 scripts/bench-pulse.py --jobs 3 --build-only
          test -z "$(git status --porcelain)"
      - name: Compile host contracts and verify feature registrations stay hidden
        run: |
          python3 scripts/verify-host-boundaries.py --jobs 3
          git diff --exit-code -- Package.swift
          test -z "$(git ls-files --others --exclude-standard Sources)"
