name: Native modules and CLI
on:
  pull_request:
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.*'
      - 'scripts/verify-native-boundaries.py'
      - 'scripts/tests/test_native_boundaries.py'
      - '.github/workflows/claude-local-diagnostics.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: claude-local-${{ github.ref }}
  cancel-in-progress: true
jobs:
  diagnostics:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Record toolchain and SDK
        run: |
          xcrun swift --version
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
      - name: Verify native target and import boundaries
        run: |
          swift package dump-package | python3 scripts/verify-native-boundaries.py --source-root .
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p 'test_native_boundaries.py'
      - name: Test native modules, diagnostics and CLI contracts
        run: swift test --jobs 3 --filter 'ClaudeLocalDiagnosticsTests|ClaudeLocalCommandTests|CLICompletenessTests|PrivacyToolsTests|FeatureTests|NativeFeatureAPITests|FeatureLaunch.*Tests|FirstRunPrewarmTests|FeatureTasksTests|SpaceSkippedRemovalTests|SpaceLensModelTests|MainOnlyExitTests'
      - name: Build App
        run: swift build --jobs 3 --product ThermoApp
